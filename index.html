<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quotes</title>
  <style>
    body { margin: 0; }
    main { scroll-snap-type: y mandatory; }

  <script src="quotes.js"></script>

</html>
